[project]
name = "audio-tools-for-agents"
version = "0.1.0"
description = "Deterministic audio manipulation tools and deep learning stems separation for AI agents."
readme = "README.md"
requires-python = ">=3.11, <3.14"
authors = [
    { name = "G. H. Chinoy", email = "ghchinoy@gmail.com" }
]
license = { text = "Apache-2.0" }
keywords = ["audio", "stems", "demucs", "htdemucs", "music", "mcp", "agent-skill"]
dependencies = [
    "click>=8.1.0",
    "demucs>=4.1.0",
    "google-cloud-storage>=2.14.0",
    "mcp>=1.2.0, <2.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
    "soundfile>=0.12.1",
    "torch>=2.2.0",
]

[project.scripts]
audio-tools = "audio_tools.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_tools"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
